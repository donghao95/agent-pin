name: Bug 报告
description: 报告 Agent Pin 的问题
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填完下面字段，未填的关键信息可能导致无法复现。

  - type: input
    id: version
    attributes:
      label: Agent Pin 版本
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 'Windows 11 22H2'
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 描述具体现象，而不是你的判断。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动桌面应用 `pnpm dev`
        2. 运行 `agent-pin markdown --title "..." --text "..."`
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 控制台输出、HTTP 返回、窗口截图。
