[package]
name = "agent-pin-desktop"
version = "0.1.0"
description = "Agent Pin desktop app"
authors = ["Agent Pin"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "agent_pin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# 单实例检查：重复启动时唤起已有实例（打开管理界面），而不是报端口绑定失败
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["limit"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
# 更新检查用：调 GitHub API 查最新 release。同步阻塞 API，在 spawn_blocking 中调用。
ureq = { version = "2", features = ["json"] }
agent-pin-shared = { path = "../../../packages/shared" }

[features]
# 这个 feature 在 tauri build (release) 时由 CLI 自动启用
custom-protocol = ["tauri/custom-protocol"]
