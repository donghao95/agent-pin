[package]
name = "agent-pin"
version = "0.1.0"
edition = "2021"
description = "Agent Pin CLI - push important content to desktop pins"
authors = ["Agent Pin Contributors"]
license = "Apache-2.0"

[[bin]]
name = "agent-pin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
agent-pin-shared = { path = "../shared" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
